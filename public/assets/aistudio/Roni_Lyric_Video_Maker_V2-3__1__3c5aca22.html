<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roni Lyric Video Maker V2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 8px 30px #0008}h1{font-size:22px;margin:0 0 4px}.muted{color:#999;font-size:13px}.step{font-weight:800;margin-bottom:9px}textarea,input,button{font:inherit;width:100%}textarea{min-height:140px;background:#080808;color:white;border:1px solid #333;border-radius:12px;padding:12px}button{border:0;border-radius:12px;padding:13px;margin-top:7px;background:#252525;color:#fff;font-weight:800}button.primary{background:#fff;color:#000;font-size:18px;padding:17px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.clock{text-align:center;font-size:32px;margin:8px}.current{text-align:center;background:#191919;border-radius:13px;padding:14px}.current b{display:block;font-size:20px;margin-top:4px}.progress{height:7px;background:#222;border-radius:9px;margin-top:10px}.bar{height:100%;width:0;background:#fff}.status{background:#171717;border-radius:12px;padding:10px;margin-top:8px;font-size:14px}.list{max-height:240px;overflow:auto}.line{padding:8px 0;border-bottom:1px solid #222;font-size:14px}.line small{display:inline-block;width:58px;color:#888}.preview{background:#000;border:1px solid #292929;border-radius:15px;overflow:hidden}.preview canvas{width:100%;display:block}a.dl{display:block;background:#fff;color:#000;text-align:center;text-decoration:none;padding:16px;border-radius:13px;font-weight:900;margin-top:9px}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:9px}.card{padding:13px}.row3{grid-template-columns:1fr}.clock{font-size:28px}}</style></head><body><div class="wrap">
<div class="card"><h1>🎵 Roni Lyric Video Maker</h1><div class="muted">Smooth Sync • Cinematic Black • Rain • Audio + Video</div></div>
<div class="card"><div class="step">১. গান</div><input id="af" type="file" accept="audio/*"><div id="an" class="muted"></div><audio id="au" controls style="width:100%;margin-top:9px"></audio></div>
<div class="card"><div class="step">২. Lyrics</div><textarea id="ly" placeholder="প্রতি লাইনে একটি lyric..."></textarea><button id="prep">Lyrics প্রস্তুত করুন</button></div>
<div class="card"><div class="step">৩. Sync</div><div class="muted">গান চালান। যে মুহূর্তে পরের lyric শুরু হবে, NEXT চাপুন।</div><div id="clk" class="clock">00:00.0</div><div class="current">এখন sync হবে:<b id="cur">—</b></div><button id="start">▶️ Start Sync</button><button id="next" class="primary">🔴 NEXT — এই লাইনের শুরু</button><div class="row"><button id="nl">🎵 NO LYRIC</button><button id="undo">↩️ Undo</button></div><div class="progress"><div id="bar" class="bar"></div></div><div id="ss" class="status">Lyrics প্রস্তুত করুন।</div><div id="list" class="list"></div></div>
<div class="card"><div class="step">৪. Preview</div><div class="row3"><button data-r="16:9">16:9</button><button data-r="9:16">9:16</button><button data-r="1:1">1:1</button></div><div class="preview" style="margin-top:9px"><canvas id="cv" width="1280" height="720"></canvas></div></div>
<div class="card"><div class="step">৫. Render & Save</div><button id="render" class="primary">🎬 RENDER VIDEO</button><div id="rs" class="status">Render শেষে এখানেই Download Video আসবে।</div><div id="dl" class="hidden"></div><div class="row"><button id="exp">💾 Export Project</button><button id="impb">📂 Import Project</button></div><input id="imp" type="file" accept=".json,application/json" class="hidden"></div>
</div>
<script>
const $=x=>document.getElementById(x),au=$("au"),cv=$("cv"),cx=cv.getContext("2d");let lines=[],cur=0,hist=[],ratio="16:9",url,dlurl,src,dest,raf;
const fmt=t=>{t=Math.max(0,t||0);return String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0")+"."+Math.floor(t%1*10)};
function size(){if(ratio=="16:9"){cv.width=1280;cv.height=720}else if(ratio=="9:16"){cv.width=720;cv.height=1280}else{cv.width=cv.height=1080}draw()}
function draw(){let w=cv.width,h=cv.height,t=au.currentTime||0;cx.fillStyle="#020202";cx.fillRect(0,0,w,h);let g=cx.createLinearGradient(0,0,w,h);g.addColorStop(0,"#151515");g.addColorStop(.5,"#030303");g.addColorStop(1,"#111");cx.fillStyle=g;cx.fillRect(0,0,w,h);cx.strokeStyle="#ffffff12";cx.lineWidth=2;for(let x=w*.12;x<w;x+=w*.18){cx.beginPath();cx.moveTo(x,h*.08);cx.lineTo(x,h*.92);cx.stroke()}for(let y=h*.2;y<h;y+=h*.16){cx.beginPath();cx.moveTo(w*.05,y);cx.lineTo(w*.95,y);cx.stroke()}let rg=cx.createRadialGradient(w/2,h*.5,0,w/2,h*.5,Math.max(w,h)*.65);rg.addColorStop(0,"#fff1");rg.addColorStop(1,"#000c");cx.fillStyle=rg;cx.fillRect(0,0,w,h);cx.strokeStyle="#ffffff25";cx.lineWidth=1;for(let i=0;i<Math.min(180,w/7);i++){let x=(i*83+t*75)%w,y=(i*137+t*210)%h;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-w*.008,y+h*.035);cx.stroke()}let q=null;for(let i=0;i<lines.length;i++)if(lines[i].start!=null&&lines[i].start<=t)q=lines[i];if(q&&!q.no){cx.textAlign="center";cx.textBaseline="middle";let fs=Math.max(26,Math.min(62,w*.043));cx.font="700 "+fs+"px system-ui";cx.fillStyle="#fff";cx.shadowColor="#000";cx.shadowBlur=18;let words=q.text.split(/\s+/),rows=[""],max=w*.84;for(let z of words){let test=(rows.at(-1)+" "+z).trim();if(cx.measureText(test).width>max&&rows.at(-1))rows.push(z);else rows[rows.length-1]=test}let gap=fs*1.25,start=h*.63-(rows.length-1)*gap/2;rows.forEach((r,i)=>cx.fillText(r,w/2,start+i*gap));cx.shadowBlur=0}cx.fillStyle="#fff8";cx.font=Math.max(12,w*.014)+"px system-ui";cx.fillText("Roni Lyric Video",w/2,h*.94)}
function list(){$("list").innerHTML=lines.map(x=>'<div class="line"><small>'+(x.start==null?"—":fmt(x.start))+'</small>'+ (x.no?"🎵 ":"")+x.text+'</div>').join("")}
function show(){$("cur").textContent=cur<lines.length?lines[cur].text:"✅ সব lyric sync complete"}
$("af").onchange=e=>{let f=e.target.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);au.src=url;$("an").textContent=f.name};
$("prep").onclick=()=>{lines=$("ly").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(text=>({text,start:null,no:false}));cur=0;hist=[];list();show();$("ss").textContent="Ready — Start Sync চাপুন।";draw()};
$("start").onclick=()=>{if(!lines.length)return alert("আগে Lyrics প্রস্তুত করুন।");cur=0;au.currentTime=0;au.play();show();$("ss").textContent="🎵 গান চলছে — lyric শুরু হলে NEXT চাপুন।"};
$("next").onclick=()=>{if(cur>=lines.length)return;hist.push(JSON.stringify({lines,cur}));lines[cur].start=au.currentTime;lines[cur].no=false;cur++;list();show();$("ss").textContent=cur>=lines.length?"✅ Sync complete — এখন Render করুন।":"পরের lyric: "+lines[cur].text;draw()};
$("nl").onclick=()=>{if(cur>=lines.length)return;hist.push(JSON.stringify({lines,cur}));lines[cur].start=au.currentTime;lines[cur].no=true;cur++;list();show();$("ss").textContent="🎵 Instrumental marker set.";draw()};
$("undo").onclick=()=>{if(!hist.length)return;let o=JSON.parse(hist.pop());lines=o.lines;cur=o.cur;list();show();draw()};
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ratio=b.dataset.r;size()});
au.addEventListener("timeupdate",()=>{$("clk").textContent=fmt(au.currentTime);$("bar").style.width=au.duration?au.currentTime/au.duration*100+"%":"0%";draw()});
$("exp").onclick=()=>{let b=new Blob([JSON.stringify({version:2,ratio,lyrics:lines},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Roni_Lyric_Project.json";a.click()};
$("impb").onclick=()=>$("imp").click();$("imp").onchange=e=>{let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);lines=o.lyrics||[];ratio=o.ratio||"16:9";cur=lines.findIndex(x=>x.start==null);if(cur<0)cur=lines.length;size();list();show();$("ss").textContent="✅ Project imported."}catch{alert("Project file ঠিক নয়।")}};r.readAsText(e.target.files[0])};
async function graph(){let AC=AudioContext||webkitAudioContext;if(!window.ac)window.ac=new AC;if(window.ac.state=="suspended")await window.ac.resume();if(!src){src=window.ac.createMediaElementSource(au);dest=window.ac.createMediaStreamDestination();src.connect(dest);src.connect(window.ac.destination)}}
$("render").onclick=async()=>{if(!au.src||!au.duration)return alert("আগে গান নির্বাচন করুন।");if(lines.some(x=>x.start==null))return alert("সব lyric sync করা হয়নি।");if(!MediaRecorder.isTypeSupported("video/webm"))return alert("Chrome browser ব্যবহার করুন।");$("dl").classList.add("hidden");$("rs").textContent="⏳ Rendering...";try{await graph();let cs=cv.captureStream(30),ms=new MediaStream([...cs.getVideoTracks(),...dest.stream.getAudioTracks()]),rec=new MediaRecorder(ms,{mimeType:"video/webm",videoBitsPerSecond:6000000}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);let done=new Promise(r=>rec.onstop=r);au.currentTime=0;draw();rec.start(250);await au.play();raf=requestAnimationFrame(function tick(){draw();raf=requestAnimationFrame(tick)});await new Promise(r=>au.onended=r);cancelAnimationFrame(raf);rec.stop();await done;let b=new Blob(chunks,{type:"video/webm"});dlurl=URL.createObjectURL(b);$("rs").textContent="✅ Render complete — ভিডিও + অডিও ready";$("dl").classList.remove("hidden");$("dl").innerHTML='<a class="dl" href="'+dlurl+'" download="Roni_Lyric_Video.webm">⬇️ DOWNLOAD VIDEO (WebM)</a>';draw()}catch(e){cancelAnimationFrame(raf);$("rs").textContent="❌ Render error: "+e.message}};
draw();
</script></body></html>
